name: Build PWA Android App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build APK via PWABuilder CLI
        run: |
          npm install -g @pwabuilder/pwabuilder-cli
          pwabuilder generate --webManifestUrl https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/manifest.json --platform android --options '{"backgroundColour":"#7C2A2A","themeColor":"#7C2A2A"}'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: output/android/
